<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background: #f2f2f2;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .calculator {

            width: 350px;

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

        }


        h1 {

            text-align: center;

            margin-bottom: 20px;

            color: #333;

        }


        #display {

            width: 100%;

            height: 70px;

            margin-bottom: 20px;

            padding: 10px;

            font-size: 30px;

            text-align: right;

            border: 2px solid #ddd;

            border-radius: 8px;

            background: #f8f8f8;

        }


        .buttons {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

        }


        button {

            height: 60px;

            border: none;

            border-radius: 8px;

            font-size: 20px;

            cursor: pointer;

            background: #7dc7ef;

            transition: 0.2s;

        }


        button:hover {

            transform: scale(1.05);

            background: #d5d5d5;

        }


        button:active {

            transform: scale(0.95);

        }


        .operator {

            background: #cfcfcf;

        }


        .clear {

            background: #ffcccc;

        }


        .equal {

            background: #bde0fe;

        }


        .zero {

            grid-column: span 2;

        }

    </style>

</head>


<body>


    <div class="calculator">

        <h1>Calculator</h1>


        <input
            type="text"
            id="display"
            readonly
        >


        <div class="buttons">


            <button onclick="clearDisplay()">
                C
            </button>


            <button onclick="deleteLast()">
                DEL
            </button>


            <button onclick="appendValue('%')">
                %
            </button>


            <button
                class="operator"
                onclick="appendValue('/')">

                ÷

            </button>


            <button onclick="appendValue('7')">
                7
            </button>

            <button onclick="appendValue('8')">
                8
            </button>

            <button onclick="appendValue('9')">
                9
            </button>

            <button
                class="operator"
                onclick="appendValue('*')">

                ×

            </button>


            <button onclick="appendValue('4')">
                4
            </button>

            <button onclick="appendValue('5')">
                5
            </button>

            <button onclick="appendValue('6')">
                6
            </button>

            <button
                class="operator"
                onclick="appendValue('-')">

                −

            </button>


            <button onclick="appendValue('1')">
                1
            </button>

            <button onclick="appendValue('2')">
                2
            </button>

            <button onclick="appendValue('3')">
                3
            </button>

            <button
                class="operator"
                onclick="appendValue('+')">

                +

            </button>


            <button
                class="zero"
                onclick="appendValue('0')">

                0

            </button>


            <button onclick="appendValue('.')">
                .
            </button>


            <button
                class="equal"
                onclick="calculate()">

                =

            </button>

        </div>

    </div>


    <script>

        const display =
            document.getElementById("display");


        // Add value

        function appendValue(value) {

            display.value += value;

        }


        // Clear

        function clearDisplay() {

            display.value = "";

        }


        // Delete

        function deleteLast() {

            display.value =
                display.value.slice(0, -1);

        }


        // Calculate

        function calculate() {

            try {

                display.value =
                    eval(display.value);

            }

            catch {

                display.value = "Error";

            }

        }


        // Keyboard support

        document.addEventListener(
            "keydown",
            function(event) {

                const key = event.key;


                if (
                    (key >= "0" && key <= "9") ||
                    key === "+" ||
                    key === "-" ||
                    key === "*" ||
                    key === "/" ||
                    key === "."
                ) 
                {

                    appendValue(key);

                }


                else if (key === "Enter") {

                    calculate();

                }


                else if (key === "Backspace") {

                    deleteLast();

                }


                else if (key === "Escape") {

                    clearDisplay();

                }

            }
        );

    </script>

</body>
</html>
